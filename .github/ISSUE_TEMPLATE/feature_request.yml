name: Idea for the garden
description: Suggest a thoughtful improvement.
labels: [enhancement]
body:
  - type: textarea
    id: experience
    attributes:
      label: What would you like to feel or do differently?
      description: Describe the experience or problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Small sketches, examples, accessibility needs or tradeoffs are welcome.
