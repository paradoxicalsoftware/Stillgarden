name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build universal macOS app
        run: ./scripts/build.sh universal
      - name: Test model and packaged assets
        run: ./scripts/test.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Stillgarden-macOS-universal
          path: dist/*
          retention-days: 14
